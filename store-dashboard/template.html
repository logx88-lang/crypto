function classifyVendor(vendor, item, isCard) {
  const ov = state.overrides[vendor];
  if (ov) return ov;
  for (const [re, c] of ITEM_RULES) if (item && re.test(item)) return c;
  for (const [re, c] of RULES) if (re.test(vendor)) return c;
  if (RESTAURANT.test(vendor)) return "식대·외식";
  return isCard ? "식대·외식" : "기타";
}
function isPersonal(cat) { const v = state.personalCats[cat]; return v === undefined ? !!(CATEGORIES.find(c => c.id === cat) || {}).personal : v; }

    if (sale > 0) { cp.orders[m] += 1; const d = new Date(dt.replace(" ", "T")); const wd = (d.getDay() + 6) % 7; heat[wd][d.getHours()] += 1; heatAmt[wd][d.getHours()] += sale; }

// 기준에 따른 월별 채널 매출
function salesByChannel() {
  const { months, hallCard, cashRcpt, cp, bmGross, yg, ledgerBaemin, ledgerYogiyo } = M;
  const platGross = sum(months, m => bmGross[m] + yg.gross[m]);

  const rows = months.map(m => {
    let hallCash = cashRcpt[m] - cp.cash[m];
    if (state.basis === "ledger" && platGross) hallCash -= excess * (bmGross[m] + yg.gross[m]) / platGross;
    hallCash = Math.max(0, hallCash);
    return { m, hallCard: hallCard[m], hallCash, baemin: bmGross[m], coupang: cp.gross[m], yogiyo: yg.gross[m] };
  });
  rows.forEach(r => r.total = r.hallCard + r.hallCash + r.baemin + r.coupang + r.yogiyo);

}

const tip = document.getElementById("tip");
function showTip(evt, html) {

  const pad = 14, w = tip.offsetWidth, h = tip.offsetHeight;
  let x = evt.pageX + pad, y = evt.pageY - h - pad;
  if (x + w > window.scrollX + document.documentElement.clientWidth - 8) x = evt.pageX - w - pad;
  if (y < window.scrollY + 8) y = evt.pageY + pad;

}
function hideTip() { tip.hidden = true; }
function chartW(el) { return Math.max(300, Math.min(760, el.clientWidth || 640)); }

// 누적 막대 (음수 없는 값) — 막대에 마우스를 올리면 구성 표시
function stackedBars(el, labels, series, opt = {}) {
  const W = chartW(el), H = opt.h || 240, L = 46, R = 8, T = 10, B = 26;
  const totals = labels.map((_, i) => sum(series, s => Math.max(0, s.values[i])));
  const max = opt.max || niceMax(Math.max(...totals, 1));
  const iw = W - L - R, ih = H - T - B, bw = Math.min(46, iw / labels.length * 0.56);
  const y = v => T + ih - v / max * ih;
  let g = "";
  const axis = opt.axis || (v => v ? man(v) : "0");
  for (let t = 0; t <= 4; t++) { const v = max * t / 4, yy = y(v); g += `<line class="${t ? "grid-l" : "base-l"}" x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}"/><text x="${L - 6}" y="${yy + 4}" text-anchor="end">${axis(v)}</text>`; }
  labels.forEach((lab, i) => {
    const cx = L + iw * (i + 0.5) / labels.length;
    let acc = 0, segs = "";
    const vis = series.filter(s => s.values[i] > 0);
    vis.forEach((s, j) => {
      const v = s.values[i], y0 = y(acc), y1 = y(acc + v); acc += v;
      const hgt = Math.max(0, y0 - y1 - (j < vis.length - 1 ? 2 : 0));
      const top = j === vis.length - 1;
      segs += top ? `<path d="M${cx - bw / 2},${y0} V${y1 + 4} Q${cx - bw / 2},${y1} ${cx - bw / 2 + 4},${y1} H${cx + bw / 2 - 4} Q${cx + bw / 2},${y1} ${cx + bw / 2},${y1 + 4} V${y0} Z" fill="${s.color}"/>`
        : `<rect x="${cx - bw / 2}" y="${y0 - hgt}" width="${bw}" height="${hgt}" fill="${s.color}"/>`;
    });
    g += `<g class="bar" data-i="${i}">${segs}<rect class="hit" x="${L + iw * i / labels.length}" y="${T}" width="${iw / labels.length}" height="${ih}"/></g>`;
    g += `<text x="${cx}" y="${H - 8}" text-anchor="middle">${esc(lab)}</text>`;
    if (opt.topLabels) g += `<text x="${cx}" y="${y(totals[i]) - 5}" text-anchor="middle" style="fill:var(--ink-2)">${man(totals[i])}</text>`;
  });
  el.innerHTML = (series.length > 1 ? legendHtml(series) : "") + `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opt.label || "")}">${g}</svg></div>`;
  el.querySelectorAll("g.bar").forEach(gEl => {
    const i = +gEl.dataset.i;
    gEl.addEventListener("mousemove", e => showTip(e, opt.tip ? opt.tip(i) : `<div class="t">${esc(labels[i])} · ${fmt(totals[i])}원</div>` + series.filter(s => s.values[i]).slice().reverse().map(s => `<div class="row"><span><i style="background:${s.color}"></i>${esc(s.name)}</span><span>${fmt(s.values[i])} <span style="opacity:.7">${pct(s.values[i], totals[i])}</span></span></div>`).join("")));

// 단일 계열 막대 (음수 허용)
function signedBars(el, labels, values, opt = {}) {

  const y = v => T + (hi - v) / (hi - lo) * ih;
  let g = "";
  const ticks = hasNeg ? [-mx, -mx / 2, 0, mx / 2, mx] : [0, mx / 4, mx / 2, mx * 3 / 4, mx];
  ticks.forEach(v => { g += `<line class="${v === 0 ? "base-l" : "grid-l"}" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${v === 0 ? "0" : man(v)}</text>`; });
  labels.forEach((lab, i) => {
    const cx = L + iw * (i + 0.5) / labels.length, v = values[i];
    const y0 = y(0), y1 = y(v), top = Math.min(y0, y1), h = Math.abs(y1 - y0);
    const col = v < 0 ? "var(--bad)" : (opt.color || "var(--s1)");
    const r = Math.min(4, h);
    const d = v >= 0 ? `M${cx - bw / 2},${y0} V${top + r} Q${cx - bw / 2},${top} ${cx - bw / 2 + r},${top} H${cx + bw / 2 - r} Q${cx + bw / 2},${top} ${cx + bw / 2},${top + r} V${y0} Z`
      : `M${cx - bw / 2},${y0} V${y1 - r} Q${cx - bw / 2},${y1} ${cx - bw / 2 + r},${y1} H${cx + bw / 2 - r} Q${cx + bw / 2},${y1} ${cx + bw / 2},${y1 - r} V${y0} Z`;
    g += `<g class="bar" data-i="${i}"><path d="${d}" fill="${col}"/><rect class="hit" x="${L + iw * i / labels.length}" y="${T}" width="${iw / labels.length}" height="${ih}"/></g>`;
    g += `<text x="${cx}" y="${(v >= 0 ? top - 5 : y1 + 13)}" text-anchor="middle" style="fill:var(--ink-2)">${man(v)}</text>`;
    g += `<text x="${cx}" y="${H - 8}" text-anchor="middle">${esc(lab)}</text>`;
  });
  el.innerHTML = `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opt.label || "")}">${g}</svg></div>`;
  el.querySelectorAll("g.bar").forEach(gEl => {
    const i = +gEl.dataset.i;
    gEl.addEventListener("mousemove", e => showTip(e, `<div class="t">${esc(labels[i])}</div><div class="row"><span>${esc(opt.name || "")}</span><span>${fmt(values[i])}원</span></div>` + (opt.extra ? opt.extra(i) : "")));
    gEl.addEventListener("mouseleave", hideTip);
  });
}

function hbars(items, color, total) {
  const max = Math.max(...items.map(i => i.value), 1);
  return `<div class="hbar">${items.map(i => `<span class="lbl" title="${esc(i.label)}">${esc(i.label)}</span><span class="track"><span class="fill" style="width:${(i.value / max * 100).toFixed(1)}%;background:${i.color || color}"></span></span><span class="val">${man(i.value)}${total ? ` <span class="muted small">${pct(i.value, total)}</span>` : ""}</span>`).join("")}</div>`;
}

function heatmap(el, matrix, amt) {
  const days = ["월", "화", "수", "목", "금", "토", "일"];
  const hours = []; for (let h = 0; h < 24; h++) if (matrix.some(r => r[h] > 0)) hours.push(h);
  const max = Math.max(...matrix.flat(), 1);
  const W = chartW(el), L = 26, T = 18, cw = (W - L) / hours.length, ch = 22, H = T + ch * 7 + 4;
  let g = "";
  hours.forEach((h, j) => { if (j % (cw < 34 ? 2 : 1) === 0) g += `<text x="${L + cw * (j + .5)}" y="12" text-anchor="middle">${h}시</text>`; });
  days.forEach((d, i) => {
    g += `<text x="${L - 6}" y="${T + ch * i + 15}" text-anchor="end">${d}</text>`;
    hours.forEach((h, j) => {
      const v = matrix[i][h], a = v / max;
      g += `<rect class="cell" data-d="${i}" data-h="${h}" x="${L + cw * j + 1}" y="${T + ch * i + 1}" width="${cw - 2}" height="${ch - 2}" rx="3" fill="var(--s1)" fill-opacity="${v ? (0.08 + a * 0.92).toFixed(2) : 0.03}"/>`;
    });
  });
  el.innerHTML = `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="요일·시간대별 주문 수">${g}</svg></div>
  <div class="legend"><span>적음</span>${[0.1, 0.3, 0.55, 0.8, 1].map(a => `<i style="background:var(--s1);opacity:${a}"></i>`).join("")}<span>많음</span></div>`;
  el.querySelectorAll("rect.cell").forEach(c => {
    const d = +c.dataset.d, h = +c.dataset.h;
    c.addEventListener("mousemove", e => showTip(e, `<div class="t">${days[d]}요일 ${h}시대</div><div class="row"><span>주문</span><span>${matrix[d][h]}건</span></div><div class="row"><span>매출</span><span>${fmt(amt[d][h])}원</span></div>`));
    c.addEventListener("mouseleave", hideTip);
  });
}

function box(title, body, right = "", sub = "") { return `<div class="box"><div class="box-head"><div><h2>${title}</h2>${sub ? `<div class="small muted">${sub}</div>` : ""}</div>${right}</div>${body}</div>`; }
function kpi(label, value, desc) { return `<div class="kpi"><span class="eyebrow">${label}</span><span class="v num">${value}</span><span class="d">${desc || ""}</span></div>`; }
function table(head, rows, opt = {}) {

}
const td = (v, n, cls = "") => `<td class="${n ? "n " : ""}${cls}">${v}</td>`;
const signed = v => `<span class="${v < 0 ? "neg" : ""}">${fmt(v)}</span>`;

function renderSummary() {

  if (severance) notes.push(`<div class="note info"><span class="pill biz">참고</span><span>퇴직금 ${man(severance)}이 비용에 들어 있습니다. 한 번만 나가는 돈이라, 평소 이익은 퇴직금을 뺀 ${eok(profit + severance)}(이익률 ${pct(profit + severance, sales)})로 보시면 됩니다.</span></div>`);
  const platGross = sum(M.months, m => M.bmGross[m]);
  if (Math.abs(platGross - M.ledgerBaemin) > 1e6) notes.push(`<div class="note"><span class="pill warn">확인 필요</span><span><b>배민 매출이 장부보다 ${eok(platGross - M.ledgerBaemin)} 많습니다.</b> 정산서 주문금액은 ${eok(platGross)}인데 장부의 배민 매출은 ${eok(M.ledgerBaemin)}로, 배민이 실제 입금한 ${eok(sum(M.months, m => M.bm.payout[m]))}보다도 적습니다. 배민 현금성 결제가 홈택스 현금영수증에 들어 있다고 봐도 차액을 다 설명하지 못해(‘세무사 장부’ 기준을 누르면 홀 현금영수증이 거의 0이 됩니다) 장부에서 배민 매출 일부가 빠졌을 수 있습니다. 세무사에게 배민 부가세 신고자료 반영 여부를 확인해 보세요.</span></div>`);
  if (M.bmMaxDate && M.bmMaxDate < M.months[M.months.length - 1] + "-28") notes.push(`<div class="note info"><span class="pill biz">참고</span><span>배민 정산서는 주문일 ${M.bmMaxDate}까지 들어 있어 마지막 달 배민 매출은 며칠 덜 잡혀 있습니다.</span></div>`);

  const ms = periodMonths();
  const salesSeries = CHANNELS.map(c => ({ name: c.name, color: c.color, values: rows.map(r => r[c.k]) }));
  const costM = costByMonth(p => !isPersonal(p.cat) && !isAsset(p.cat));
  const profitVals = rows.map(r => r.total - costM[r.m]);

  main.innerHTML = `<section class="panel fade">
    <div class="kpis">
      ${kpi("총매출", eok(sales), `${ms.length}개월 · VAT 포함`)}

      ${kpi(hasLabor ? "추정 이익" : "추정 이익 (인건비 전)", `<span class="${profit < 0 ? "neg" : ""}">${eok(profit)}</span>`, `이익률 ${pct(profit, sales)}` + (severance ? ` · 퇴직금 빼면 ${eok(profit + severance)}` : ""))}
      ${kpi("배달앱 비중", pct(deliv, sales), `배달 매출 ${eok(deliv)}`)}
      ${vatOut != null ? kpi("부가세 (참고)", eok(vatOut - vatIn), `매출세액 ${man(vatOut)} − 매입세액 ${man(vatIn)}`) : ""}
    </div>
    ${notes.length ? `<div class="notes">${notes.join("")}</div>` : ""}
    <div class="grid g2">
      ${box("월별 매출", `<div id="c-sales"></div>`, "", "채널별 · 막대에 마우스를 올리면 구성 비율")}
      ${box("월별 사업 비용", `<div id="c-cost"></div>`, "", "상위 항목 · 생활비·자산구입 제외")}
    </div>
    <div class="grid g2">
      ${box(hasLabor ? "월별 추정 이익" : "월별 추정 이익 (인건비 전)", `<div id="c-profit"></div>`, "", "매출 − 사업 비용" + rows.map(r => { const sv = sum(biz.filter(p => p.cat === "퇴직금" && p.date.startsWith(r.m)), p => p.total); return sv ? ` · ${mLabel(r.m)}은 퇴직금 ${man(sv)} 포함 (빼면 ${man(r.total - costM[r.m] + sv)})` : ""; }).join(""))}
      ${box("매출 대비 비용 구성", `<div id="cost-share"></div>`, "", "선택한 기간 · 사업 비용 기준")}
    </div>
  </section>`;
  stackedBars(document.getElementById("c-sales"), rows.map(r => mLabel(r.m)), salesSeries, { topLabels: true, label: "월별 채널 매출" });
  const { series } = costSeries(rows.map(r => r.m));
  stackedBars(document.getElementById("c-cost"), rows.map(r => mLabel(r.m)), series, { topLabels: true, label: "월별 비용" });
  signedBars(document.getElementById("c-profit"), rows.map(r => mLabel(r.m)), profitVals, { name: "추정 이익", color: "var(--s6)", extra: i => { const sv = sum(M.purchases.filter(p => p.cat === "퇴직금" && p.date.startsWith(rows[i].m)), p => p.total);
    return `<div class="row"><span>매출</span><span>${fmt(rows[i].total)}</span></div><div class="row"><span>비용</span><span>${fmt(costM[rows[i].m])}</span></div>` + (sv ? `<div class="row"><span>퇴직금 포함</span><span>${fmt(sv)}</span></div><div class="row"><span>퇴직금 빼면</span><span>${fmt(profitVals[i] + sv)}</span></div>` : ""); } });
  const byCat = groupSum(biz, p => p.cat).sort((a, b) => b.value - a.value);
  document.getElementById("cost-share").innerHTML = hbars(byCat.slice(0, 10).map(c => ({ label: c.label, value: c.value })), "var(--s1)", sales) + `<div class="small muted">비율은 매출 대비. 총비용 ${eok(cost)} = 매출의 ${pct(cost, sales)}</div>`;
}

function groupSum(rows, keyFn, valFn = p => p.total) {
  const o = {}; for (const r of rows) { const k = keyFn(r); o[k] = (o[k] || 0) + valFn(r); }
  return Object.entries(o).map(([label, value]) => ({ label, value }));
}
function costSeries(months) {
  const biz = M.purchases.filter(p => months.includes(p.date.slice(0, 7)) && !isPersonal(p.cat) && !isAsset(p.cat));
  const top = groupSum(biz, p => p.cat).sort((a, b) => b.value - a.value).slice(0, 7).map(c => c.label);
  const colors = ["var(--s1)", "var(--s2)", "var(--s3)", "var(--s4)", "var(--s5)", "var(--s6)", "var(--s7)"];
  const series = top.map((c, i) => ({ name: c, color: colors[i], values: months.map(m => sum(biz.filter(p => p.cat === c && p.date.startsWith(m)), p => p.total)) }));
  const rest = months.map(m => sum(biz.filter(p => !top.includes(p.cat) && p.date.startsWith(m)), p => p.total));
  if (rest.some(v => v)) series.push({ name: "그 밖의 항목", color: "var(--other)", values: rest });
  return { series, top };
}

/* ============================================================ 매출 */
function renderSales() {
  const all = salesByChannel(); const rows = all.filter(r => periodMonths().includes(r.m));
  const tot = Object.fromEntries(CHANNELS.map(c => [c.k, sum(rows, r => r[c.k])])); tot.total = sum(rows, r => r.total);
  const ms = periodMonths();
  const cpOrders = sum(ms, m => M.cp.orders[m]), cpGross = sum(ms, m => M.cp.gross[m]);
  const heatM = Array.from({ length: 7 }, () => Array(24).fill(0)), heatA = Array.from({ length: 7 }, () => Array(24).fill(0));
  for (const r of DATA.coupang) { if (!ms.includes(r[1].slice(0, 7))) continue; const s = r[2] + r[3] + r[4]; if (s <= 0) continue; const d = new Date(r[1].replace(" ", "T")); const wd = (d.getDay() + 6) % 7; heatM[wd][d.getHours()]++; heatA[wd][d.getHours()] += s; }
  const wdTot = heatM.map(r => sum(r)); const days = ["월", "화", "수", "목", "금", "토", "일"];
  const bestDay = wdTot.indexOf(Math.max(...wdTot));
  const hourTot = Array.from({ length: 24 }, (_, h) => sum(heatM, r => r[h])); const bestHour = hourTot.indexOf(Math.max(...hourTot));

  main.innerHTML = `<section class="panel fade">
    <div class="kpis">${CHANNELS.map(c => kpi(c.name, eok(tot[c.k]), `비중 ${pct(tot[c.k], tot.total)}`)).join("")}</div>
    ${box("채널별 월 매출", table([{ t: "월" }, ...CHANNELS.map(c => ({ t: c.name, n: 1 })), { t: "합계", n: 1 }, { t: "전월 대비", n: 1 }],
      rows.map(r => { const prev = all[all.findIndex(x => x.m === r.m) - 1]; const ch = prev ? (r.total / prev.total - 1) * 100 : null;
        return `<tr>${td(mLabel(r.m))}${CHANNELS.map(c => td(fmt(r[c.k]), 1)).join("")}${td(`<b>${fmt(r.total)}</b>`, 1)}${td(ch == null ? "–" : `<span class="${ch < 0 ? "neg" : "pos"}">${ch > 0 ? "+" : ""}${ch.toFixed(1)}%</span>`, 1)}</tr>`; })
      .concat(`<tr class="total">${td("합계")}${CHANNELS.map(c => td(fmt(tot[c.k]), 1)).join("")}${td(fmt(tot.total), 1)}${td("", 1)}</tr>`)),
      "", state.basis === "ledger" ? "세무사 장부 기준: 장부 매출 합계에 맞추기 위해 배민·요기요 정산서 금액 중 장부를 넘는 부분을 홀 현금영수증에서 뺐습니다." : "플랫폼 정산서 기준: 배민·쿠팡·요기요는 각 정산 원자료, 홀은 홈택스 카드·현금영수증 매출(쿠팡 현금결제분 제외)입니다.")}
    <div class="grid g2">
      ${box("채널 구성 추이", `<div id="c-mix"></div>`, "", "월별 매출 비중")}
      ${box("쿠팡이츠 주문 패턴", `<div id="c-heat"></div><div class="small muted">주문 ${fmt(cpOrders)}건 · 객단가 ${fmt(cpGross / Math.max(cpOrders, 1))}원 · 가장 바쁜 요일 ${days[bestDay]}요일 · 가장 바쁜 시간 ${bestHour}시대</div>`, "", "요일 × 시간대 주문 수 (쿠팡이츠 주문 단위 자료)")}
    </div>
    ${box("배달앱 주문 수·객단가", table([{ t: "월" }, { t: "쿠팡 주문", n: 1 }, { t: "쿠팡 객단가", n: 1 }, { t: "쿠팡 환불", n: 1 }, { t: "요기요 주문", n: 1 }, { t: "요기요 객단가", n: 1 }],
      ms.map(m => `<tr>${td(mLabel(m))}${td(fmt(M.cp.orders[m]), 1)}${td(fmt(M.cp.gross[m] / Math.max(M.cp.orders[m], 1)), 1)}${td(M.cp.refunds[m] + "건 · " + fmt(M.cp.refund[m]), 1)}${td(fmt(M.yg.orders[m]), 1)}${td(M.yg.orders[m] ? fmt(M.yg.gross[m] / M.yg.orders[m]) : "–", 1)}</tr>`)), "", "배민 정산서는 일자별 합계라 주문 수가 없습니다.")}
  </section>`;
  const shares = CHANNELS.map(c => ({ name: c.name, color: c.color, values: rows.map(r => r.total ? r[c.k] / r.total * 100 : 0) }));
  stackedBars(document.getElementById("c-mix"), rows.map(r => mLabel(r.m)), shares, { label: "채널 비중", max: 100, axis: v => Math.round(v) + "%",
    tip: i => `<div class="t">${mLabel(rows[i].m)}</div>` + CHANNELS.slice().reverse().map(c => `<div class="row"><span><i style="background:${c.color}"></i>${c.name}</span><span>${pct(rows[i][c.k], rows[i].total)}</span></div>`).join("") });
  heatmap(document.getElementById("c-heat"), heatM, heatA);
}

// --- 통장 파일 읽기 (SheetJS)
const B_DATE = ["거래일시", "거래일자", "거래일", "일자", "날짜"], B_IN = ["입금", "맡기신"], B_OUT = ["출금", "찾으신", "지급"];
const B_PARTY = ["보낸분", "받는분", "의뢰인", "수취인", "거래처", "기재내용"], B_MEMO = ["적요", "거래내용", "내용", "메모"];
function toNum(v) { if (typeof v === "number") return Math.round(v); const s = String(v ?? "").replace(/[,원\s]/g, ""); const n = parseFloat(s); return isFinite(n) ? Math.round(n) : 0; }
function toYmd(v) {
  if (v instanceof Date) return v.toISOString().slice(0, 10);
  if (typeof v === "number" && v > 30000 && v < 80000) { const d = new Date(Math.round((v - 25569) * 864e5)); return d.toISOString().slice(0, 10); }
  const m = String(v ?? "").match(/(\d{4})[.\-/년\s]*(\d{1,2})[.\-/월\s]*(\d{1,2})/); return m ? `${m[1]}-${m[2].padStart(2, "0")}-${m[3].padStart(2, "0")}` : null;
}
function parseBankSheet(rows) {
  let h = -1;
  for (let i = 0; i < Math.min(30, rows.length); i++) { const j = rows[i].map(x => String(x ?? "")).join(" "); if (B_DATE.some(k => j.includes(k)) && B_IN.some(k => j.includes(k)) && B_OUT.some(k => j.includes(k)) && j.includes("잔액")) { h = i; break; } }
  if (h < 0) return [];
  const head = rows[h].map(x => String(x ?? "").trim());
  const find = keys => head.findIndex(c => keys.some(k => c.includes(k)));
  const di = find(B_DATE), ii = find(B_IN), oi = find(B_OUT), bi = find(["잔액"]);
  const pi = find(B_PARTY);
  const memoIx = head.map((c, i) => i !== pi && B_MEMO.some(k => c.includes(k)) ? i : -1).filter(i => i >= 0);
  const txt = v => String(v ?? "").replace(/^[\s\u3000]+|[\s\u3000]+$/g, "");
  const out = [];
  for (const r of rows.slice(h + 1)) {
    const d = toYmd(r[di]); if (!d) continue;
    const inc = toNum(r[ii]), o = toNum(r[oi]); if (!inc && !o) continue;
    const tm = (r[di] instanceof Date) ? r[di].toTimeString().slice(0, 5) : ((txt(r[di]).match(/(\d{1,2}):(\d{2})/) || [])[0] || "");
    const party = pi >= 0 ? txt(r[pi]) : "", memo = memoIx.map(i => txt(r[i])).filter(Boolean).join(" ");
    out.push({ date: d, time: tm.length === 4 ? "0" + tm : tm, party, memo, desc: [party, memo].filter(Boolean).join(" "), in: inc, out: o, balance: bi >= 0 ? toNum(r[bi]) : 0 });
  }
  return out;
}
function bindBankUpload() {
  const input = document.getElementById("bank-file"), drop = document.getElementById("drop"), msg = document.getElementById("bank-msg");
  const handle = async files => {
    if (typeof XLSX === "undefined") { msg.textContent = "엑셀 읽기 도구를 불러오지 못했습니다. 인터넷 연결을 확인한 뒤 새로고침하세요."; return; }
    let added = [];
    for (const file of files) {
      try {
        const buf = await file.arrayBuffer();
        let wb;
        if (/\.csv$/i.test(file.name)) {  // 은행 CSV는 대개 EUC-KR
          let text; try { text = new TextDecoder("utf-8", { fatal: true }).decode(buf); } catch (e) { text = new TextDecoder("euc-kr").decode(buf); }
          wb = XLSX.read(text.replace(/^\uFEFF/, ""), { type: "string", raw: true });
        } else wb = XLSX.read(buf, { type: "array", cellDates: true });
        for (const name of wb.SheetNames) added = added.concat(parseBankSheet(XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, raw: true, defval: "" })));
      } catch (e) { msg.textContent = `${file.name}: 읽지 못했습니다. 암호가 걸린 파일이면 암호를 풀고 다시 저장해서 올려 주세요.`; return; }
    }
    if (!added.length) { msg.textContent = "거래일·입금·출금·잔액 열을 찾지 못했습니다. 은행에서 받은 원본 엑셀인지 확인해 주세요."; return; }
    const key = b => [b.date, b.time || "", b.desc, b.in, b.out, b.balance].join("|");
    const seen = new Set(state.bank.map(key));
    const fresh = added.filter(b => !seen.has(key(b)) && seen.add(key(b)));
    state.bank = state.bank.concat(fresh).sort((a, b) => (a.date + (a.time || "")).localeCompare(b.date + (b.time || "")));
    store.set("bank", state.bank);
    recompute();
    const m2 = document.getElementById("bank-msg"); if (m2) m2.textContent = `${fresh.length}건을 추가했습니다${added.length - fresh.length ? ` (중복 ${added.length - fresh.length}건 제외)` : ""}.`;
  };
  input.addEventListener("change", () => handle([...input.files]));
  drop.addEventListener("dragover", e => { e.preventDefault(); drop.classList.add("over"); });
  drop.addEventListener("dragleave", () => drop.classList.remove("over"));
  drop.addEventListener("drop", e => { e.preventDefault(); drop.classList.remove("over"); handle([...e.dataTransfer.files]); });
  const clr = document.getElementById("bank-clear");
  if (clr) clr.addEventListener("click", () => {
    if (clr.dataset.confirm) { state.bank = []; store.set("bank", []); recompute(); return; }
    clr.dataset.confirm = "1"; clr.textContent = "한 번 더 누르면 지웁니다"; clr.classList.add("primary");
  });
}

  M = compute();
  const first = M.months[0], last = M.months[M.months.length - 1];
  document.getElementById("store-eyebrow").textContent = `매입·매출 분석 · ${first ? first.slice(0, 4) + "년 " + mLabel(first) + "–" + mLabel(last) : ""}`;
  document.getElementById("gen-info").textContent = `${DATA.sources.length}개 파일 · ${DATA.generated} 기준`;
  const seg = document.getElementById("period-seg");
  seg.innerHTML = `<button type="button" data-p="all">전체</button>` + M.months.map(m => `<button type="button" data-p="${m}">${mLabel(m)}</button>`).join("");
  seg.addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; state.period = b.dataset.p; render(); });
  document.getElementById("basis-seg").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; state.basis = b.dataset.basis; store.set("basis", state.basis); render(); });
  document.getElementById("tabs").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; state.tab = b.dataset.tab; store.set("tab", state.tab); render(); });
  if (!RENDER[state.tab]) state.tab = "summary";
  render();
}
init();
</script>
